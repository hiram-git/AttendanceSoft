services:
  postgres:
    image: postgres:17-alpine
    container_name: attendancesoft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendancesoft
      POSTGRES_PASSWORD: attendancesoft
      POSTGRES_DB: attendancesoft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
